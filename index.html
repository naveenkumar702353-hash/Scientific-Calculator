<!DOCTYPE html>
<html>
    <head>
        <title>Scientific Calculator</title>
        <link href="/CSS/styles.css" type="text/css" rel="stylesheet" />
    </head>
    <body>
        <div id="calculator">
            <h1>Calculator</h1>
            <input type="text" id="display"/>
            <div class="buttons">
                <button class="btn">2nd</button>
                <button class="btn" onclick="Value('(')">(</button>
                <button class="btn" onclick="Value(')')">)</button>
                <button class="btn" onclick="Value('10**')">10<sup>x</sup></button>
                <button class="btn" onclick="memoryClear()">mc</button>
                <button class="btn" onclick="memoryAdd()">m+</button>
                <button class="btn" onclick="memorySubtract()">m-</button>
                <button class="btn" onclick="memoryRecall()">mr</button>
            </div>
            <div class="buttons">
                <button class="btn" onclick="Value('1/')">1/x</button>
                <button class="btn" onclick="Value('**2')">x<sup>2</sup></button>
                <button class="btn" onclick="Value('**3')">x<sup>3</sup></button>
                <button class="btn" onclick="Value('**')">x<sup>y</sup></button>
                <button class="btn" style="background-color:rgb(16, 156, 222)" onclick="clearDisplay()">AC</button>
                <button class="btn" style="background-color:rgb(16, 156, 222)" onclick="deleteLast()">⌫</button>
                <button class="btn" style="background-color:rgb(16, 156, 222)" onclick="toggleSign()">+/-</button>
                <button class="btn" style="background-color:rgb(16, 156, 222)" onclick="Value('/')">÷</button>
            </div>
            <div class="buttons">
                <button class="btn" onclick="Value('factorial(')">x!</button>
                <button class="btn" onclick="Value('Math.sqrt(')">√</button>
                <button class="btn" onclick="Value('root(')"><sup>y</sup>√X</button>
                <button class="btn" onclick="Value('Math.log10(')">log</button>
                <button class="btn" onclick="Value(7)">7</button>
                <button class="btn" onclick="Value(8)">8</button>
                <button class="btn" onclick="Value(9)">9</button>
                <button class="btn" style="background-color:rgb(16, 156, 222)" onclick="Value('*')">x</button>
            </div>
            <div class="buttons">
                <button class="btn" onclick="Value('sin(')">sin</button>
                <button class="btn" onclick="Value('cos(')">cos</button>
                <button class="btn" onclick="Value('tan(')">tan</button>
                <button class="btn" onclick="Value('Math.log(')">ln</button>
                <button class="btn" onclick="Value(4)">4</button>
                <button class="btn" onclick="Value(5)">5</button>
                <button class="btn" onclick="Value(6)">6</button>
                <button class="btn" style="background-color:rgb(16, 156, 222)" onclick="Value('-')">-</button>
            </div>
            <div class="buttons">
                <button class="btn" onclick="Value('Math.sinh(')">sinh</button>
                <button class="btn" onclick="Value('Math.cosh(')">cosh</button>
                <button class="btn" onclick="Value('Math.tanh(')">tanh</button>
                <button class="btn" onclick="Value('Math.exp(')">e<sup>x</sup></button>
                <button class="btn" onclick="Value(1)">1</button>
                <button class="btn" onclick="Value(2)">2</button>
                <button class="btn" onclick="Value(3)">3</button>
                <button class="btn" style="background-color:rgb(16, 156, 222)" onclick="Value('+')">+</button>
            </div>
            <div class="buttons">
                <button class="btn angle-mode" onclick="toggleAngleMode()">DEG</button>
                <button class="btn" onclick="Value('Math.PI')">π</button>
                <button class="btn" onclick="Value('*10**')">EE</button>
                <button class="btn" onclick="Value('Math.random()')">Rand</button>
                <button class="btn" onclick="percentage()">%</button>
                <button class="btn" onclick="Value(0)">0</button>
                <button class="btn" onclick="Value('.')">.</button>
                <button class="btn" style="background-color:rgb(155, 217, 245)" onclick="calculate()">=</button>
            </div>
        </div>
    </body>
    <script src="/JS/Calculator-js.js"></script>
</html>
